name: Scan Polymarket Wallets

on:
  schedule:
    - cron: '5 */2 * * *'  # Every 2 hours at :05
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false  # Let running scans finish, skip new ones

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Scanner
        run: node scanner/scan.js

      - name: Commit Results
        if: always()
        run: |
          git config user.name "Polymarket Scanner Bot"
          git config user.email "scanner@polymarket-signals.local"
          git rm -f --ignore-unmatch data/wallets.json data/markets.json data/analytics.json
          git add data/
          SCAN_COUNT=$(node -e "const fs = require('fs'); try { const s = JSON.parse(fs.readFileSync('data/state.json','utf8')); console.log(s.scanCount); } catch(e) { console.log('unknown'); }")
          git diff --cached --quiet || git commit -m "Scan #${SCAN_COUNT}: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push) || (sleep 5 && git pull --rebase && git push)
